<nav class="breadcrumbs" aria-label="Breadcrumb">
  @for (item of items(); track item.route; let last = $last) {
    <button
      type="button"
      class="breadcrumbs__item"
      [class.breadcrumbs__item--active]="last"
      [disabled]="last"
      (click)="navigate(item.route)"
    >
      {{ item.label }}
    </button>
  }
</nav>
