<h2 mat-dialog-title>
  {{ data.mode === 'add' ? 'Add Sport' : 'Edit Sport' }}
</h2>

<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Sport Name</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput rows="3" formControlName="description"> </textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Governing Bodies</mat-label>
      <input matInput type="number" formControlName="governingBodyCount" />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>

  <button mat-flat-button color="primary" type="button" (click)="save()">Save</button>
</mat-dialog-actions>
