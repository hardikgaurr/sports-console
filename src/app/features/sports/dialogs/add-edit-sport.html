<h2 class="dialog-title">
  {{ data.mode === 'add' ? 'Add Sport' : 'Edit Sport' }}
</h2>

<form class="dialog-form" [formGroup]="form">
  <app-input label="Sport Name" placeholder="Enter sport name" formControlName="name"> </app-input>

  <app-input
    label="Description"
    type="textarea"
    placeholder="Enter description"
    formControlName="description"
  >
  </app-input>

  <app-input
    label="Governing Bodies"
    type="number"
    placeholder="0"
    formControlName="governingBodyCount"
  >
  </app-input>

  <div class="dialog-actions">
    <app-button variant="outline" (buttonClick)="cancel()"> Cancel </app-button>

    <app-button (buttonClick)="save()"> Save </app-button>
  </div>
</form>
