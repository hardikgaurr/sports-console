<div class="dialog">
  <div class="dialog__header">
    <h2 class="dialog__title">
      {{ data.mode === 'add' ? 'Add Sport' : 'Edit Sport' }}
    </h2>

    <p class="dialog__subtitle">
      {{
        data.mode === 'add'
          ? 'Create a new sport for the catalogue.'
          : 'Update the sport information.'
      }}
    </p>
  </div>

  <form class="dialog__body" [formGroup]="form">
    <app-input label="Sport Name" placeholder="Enter sport name" formControlName="name">
    </app-input>

    <app-input
      label="Description"
      type="textarea"
      placeholder="Enter description"
      formControlName="description"
    >
    </app-input>

    <app-input
      label="Governing Bodies"
      type="number"
      placeholder="0"
      formControlName="governingBodyCount"
    >
    </app-input>
  </form>

  <div class="dialog__footer">
    <app-button variant="outline" [fullWidth]="false" (buttonClick)="cancel()"> Cancel </app-button>

    <app-button [fullWidth]="false" (buttonClick)="save()">
      {{ data.mode === 'add' ? 'Add Sport' : 'Save Changes' }}
    </app-button>
  </div>
</div>
