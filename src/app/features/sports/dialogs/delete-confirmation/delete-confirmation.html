<div class="dialog">
  <div class="dialog__header">
    <h2 class="dialog__title">Delete Sport</h2>

    <p class="dialog__subtitle">
      Are you sure you want to permanently delete
      <strong>{{ data.sport.name }}</strong
      >?
    </p>

    <p class="dialog__subtitle">This action cannot be undone.</p>
  </div>

  <div class="dialog__footer">
    <app-button variant="outline" [fullWidth]="false" (buttonClick)="cancel()"> Cancel </app-button>

    <app-button [fullWidth]="false" (buttonClick)="confirm()"> Delete </app-button>
  </div>
</div>
