<app-breadcrumbs [items]="breadcrumbs()"> </app-breadcrumbs>

@if (sport(); as currentSport) {
  <section class="sport-detail">
    <header class="sport-detail__header">
      <div class="sport-detail__info">
        <div class="sport-detail__emoji">🏆</div>

        <div>
          <h1>
            {{ currentSport.name }}
          </h1>

          <p>
            {{ currentSport.description }}
          </p>

          <span>
            Created
            {{ currentSport.createdAt | date: 'mediumDate' }}
          </span>
        </div>
      </div>

      <button class="sport-detail__add-button" type="button">+ Add Governing Body</button>
    </header>

    <app-sports-stats
      [totalSports]="1"
      [totalBodies]="governingBodiesCount()"
      [competitions]="organisationsCount()"
      [participants]="participantsCount()"
    >
    </app-sports-stats>

    <div class="sport-detail__card">
      <div class="sport-detail__card-header">
        <h2>Governing Bodies</h2>

        <p>No governing bodies have been added yet.</p>
      </div>
    </div>
  </section>
}
