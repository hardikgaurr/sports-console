<section class="sports-page">
  <app-sports-toolbar
    [searchQuery]="searchQuery()"
    [isAdmin]="isAdmin()"
    (searchChange)="updateSearch($event)"
    (addSport)="openAddSportDialog()"
    (bulkImport)="openBulkImportDialog()"
  >
  </app-sports-toolbar>

  @if (deleteError()) {
    <p class="sports-page__error">
      {{ deleteError() }}
    </p>
  }

  @if (importSummary(); as summary) {
    <p class="sports-page__success">
      Import complete. Added: {{ summary.added }} Skipped: {{ summary.skipped }}

      @if (summary.failed > 0) {
        · Failed: {{ summary.failed }}
      }
    </p>
  }

  <app-sports-stats
    [totalSports]="totalSports()"
    [totalBodies]="0"
    [competitions]="0"
    [participants]="0"
  >
  </app-sports-stats>

  <app-sports-table
    [sports]="filteredSports()"
    [isAdmin]="isAdmin()"
    (view)="viewSport($event)"
    (edit)="editSport($event)"
    (deleteSport)="deleteSport($event)"
  >
  </app-sports-table>
</section>
