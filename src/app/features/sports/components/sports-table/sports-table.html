<div class="sports-table">
  <table>
    <thead>
      <tr>
        <th>Sport</th>
        <th>Description</th>
        <th>Governing Bodies</th>
        <th width="120">Actions</th>
      </tr>
    </thead>

    <tbody>
      @for (sport of sports; track sport.id) {
        <tr>
          <td>{{ sport.name }}</td>

          <td>{{ sport.description }}</td>

          <td>{{ sport.governingBodyCount }}</td>

          <td class="actions">
            <button
              class="icon-button"
              type="button"
              aria-label="Edit sport"
              (click)="onEdit(sport)"
            >
              <img src="assets/icons/common/edit.svg" alt="" width="18" height="18" />
            </button>

            <button
              class="icon-button danger"
              type="button"
              aria-label="Delete sport"
              (click)="onDelete(sport.id)"
            >
              <img src="assets/icons/common/delete.svg" alt="" width="18" height="18" />
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
