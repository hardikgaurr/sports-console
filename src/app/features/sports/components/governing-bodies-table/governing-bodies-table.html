<div class="sports-table">
  <table>
    <thead>
      <tr>
        <th class="col-name">Name</th>
        <th class="col-country">Country</th>
        <th class="col-actions">Actions</th>
      </tr>
    </thead>

    <tbody>
      @for (governingBody of governingBodies; track governingBody.id) {
        <tr>
          <td class="col-name">
            <button type="button" class="sport-link" (click)="onView(governingBody)">
              {{ governingBody.name }}
            </button>
          </td>

          <td class="col-country">
            {{ governingBody.country ?? '-' }}
          </td>

          <td class="actions">
            @if (isAdmin) {
              <button
                class="icon-button"
                type="button"
                aria-label="Edit governing body"
                (click)="onEdit(governingBody)"
              >
                <img src="assets/icons/common/edit.svg" alt="" width="18" height="18" />
              </button>

              <button
                class="icon-button danger"
                type="button"
                aria-label="Delete governing body"
                (click)="onDelete(governingBody.id)"
              >
                <img src="assets/icons/common/delete.svg" alt="" width="18" height="18" />
              </button>
            }
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
