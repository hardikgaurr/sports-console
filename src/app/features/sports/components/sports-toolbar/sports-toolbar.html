<div class="sports-toolbar">
  <div class="sports-toolbar__heading">
    <h2>Sports Catalogue</h2>
    <p>View, search and manage all sports available on the platform.</p>
  </div>

  <div class="sports-toolbar__actions">
    <app-input
      placeholder="Search sports..."
      [ngModel]="searchQuery"
      (ngModelChange)="onSearch($event)"
    >
    </app-input>

    <app-button variant="outline" [fullWidth]="false" (buttonClick)="onReset()">
      Reset to Seed
    </app-button>

    <app-button [fullWidth]="false" (buttonClick)="onAddSport()"> + Add Sport </app-button>
  </div>
</div>
